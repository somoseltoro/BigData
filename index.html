<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Big Data | Data Analytics</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232B59FF'/%3E%3Crect x='7' y='15' width='4' height='10' rx='1.5' fill='white'/%3E%3Crect x='14' y='8' width='4' height='17' rx='1.5' fill='white'/%3E%3Crect x='21' y='12' width='4' height='13' rx='1.5' fill='white'/%3E%3C/svg%3E">

  <!-- Tipografía: si no hay internet, el navegador usa la fuente del sistema -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================
       TOKENS
       ========================================================== */
    :root {
      --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
      --font-ui: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;

      --fondo: #050A18;
      --texto: #EAF0FF;
      --suave: #A9B7D8;
      --borde: rgba(255, 255, 255, .10);
      --cobalto: #2B59FF;
      --cobalto-claro: #7B97FF;
    }

    /* ==========================================================
       BASE
       ========================================================== */
    *, *::before, *::after { box-sizing: border-box; }
    html { color-scheme: dark; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: var(--font-ui);
      font-size: 15px;
      line-height: 1.45;
      color: var(--texto);
      background: var(--fondo);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, p { margin: 0; }
    a, button { font: inherit; }

    :focus-visible { outline: 3px solid var(--cobalto-claro); outline-offset: 3px; }

    /* ==========================================================
       FONDO TECNOLÓGICO
       ========================================================== */
    .fondo {
      position: fixed; inset: 0; z-index: -3;
      background:
        radial-gradient(60% 50% at 12% 8%, rgba(43, 89, 255, .38), transparent 62%),
        radial-gradient(48% 44% at 92% 18%, rgba(34, 211, 238, .20), transparent 62%),
        radial-gradient(56% 50% at 62% 104%, rgba(139, 92, 246, .26), transparent 62%),
        var(--fondo);
    }

    .rejilla {
      position: fixed; inset: 0; z-index: -2;
      background-image:
        linear-gradient(rgba(148, 163, 255, .075) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 255, .075) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 35%, #000 25%, transparent 78%);
              mask-image: radial-gradient(ellipse 80% 70% at 50% 35%, #000 25%, transparent 78%);
    }

    #red { position: fixed; inset: 0; z-index: -1; width: 100%; height: 100%; pointer-events: none; }

    /* ==========================================================
       ESTRUCTURA
       ========================================================== */
    .pagina {
      min-height: 100vh; min-height: 100dvh;
      width: min(1280px, 100% - 56px);
      margin-inline: auto;
      display: flex; flex-direction: column;
      padding: 26px 0 30px;
    }

    /* ---------- Encabezado ---------- */
    .barra { display: flex; align-items: center; justify-content: space-between; gap: 16px; }

    .marca { display: flex; align-items: center; gap: 12px; }
    .marca-icono {
      width: 44px; height: 44px; border-radius: 13px;
      display: grid; place-items: center;
      background: var(--cobalto); color: #fff;
      box-shadow: 0 0 34px -4px rgba(43, 89, 255, .85);
    }
    .marca-icono svg { width: 25px; height: 25px; }
    .marca-texto { display: flex; flex-direction: column; line-height: 1.1; }
    .marca-nombre {
      font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: -.025em;
    }
    .marca-sub {
      margin-top: 4px;
      font-family: var(--font-display); font-weight: 600; font-size: 12.5px; letter-spacing: .08em;
      color: var(--suave);
    }

    .reloj {
      display: inline-flex; align-items: center; gap: 9px;
      padding: 7px 14px; border-radius: 999px;
      background: rgba(34, 197, 94, .12);
      border: 1px solid rgba(34, 197, 94, .28);
      color: #DCFCE7; font-size: 12.5px; font-weight: 500; white-space: nowrap;
    }
    .reloj::before {
      content: ""; width: 8px; height: 8px; border-radius: 50%; background: #22C55E;
      animation: pulso 1.8s ease-in-out infinite;
    }

    /* ---------- Título ---------- */
    .principal { flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 44px; padding: 36px 0 10px; }

    .titulo h1 {
      font-family: var(--font-display); font-weight: 700;
      font-size: clamp(56px, 9.5vw, 124px); line-height: .96; letter-spacing: -.045em;
      color: #fff;
    }
    .titulo h1 span {
      display: inline-block; white-space: nowrap;
      background: linear-gradient(100deg, #FFFFFF 18%, #A9BEFF 58%, #5EEAD4 100%);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
    }
    .titulo p { margin-top: 16px; max-width: 46ch; font-size: 18px; color: var(--suave); }

    /* ---------- Áreas ---------- */
    .areas { display: grid; gap: 20px; grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .area {
      position: relative; isolation: isolate; overflow: hidden;
      display: flex; flex-direction: column; gap: 30px;
      min-height: 290px; padding: 26px;
      border-radius: 24px; border: 1px solid var(--borde);
      background: linear-gradient(160deg, rgba(255, 255, 255, .07), rgba(255, 255, 255, .02));
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      color: var(--texto); text-decoration: none;
      transition: transform .28s cubic-bezier(.2, .7, .2, 1), border-color .28s, box-shadow .28s;
      animation: entrada .75s cubic-bezier(.2, .7, .2, 1) both;
      animation-delay: calc(var(--i) * 90ms + 250ms);
    }
    .area::before {                                  /* luz que sigue al cursor */
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: radial-gradient(340px circle at var(--mx, 50%) var(--my, 0%), rgba(var(--tono), .24), transparent 62%);
      opacity: 0; transition: opacity .28s;
    }
    .area:hover, .area:focus-visible {
      transform: translateY(-7px);
      border-color: rgba(var(--tono), .7);
      box-shadow: 0 28px 64px -26px rgba(var(--tono), .6), inset 0 0 0 1px rgba(var(--tono), .22);
    }
    .area:hover::before, .area:focus-visible::before { opacity: 1; }

    .area-sigla {
      width: 66px; height: 66px; border-radius: 19px;
      display: grid; place-items: center;
      font-family: var(--font-display); font-weight: 700; font-size: 21px; letter-spacing: .02em;
      color: rgb(var(--tono));
      background: rgba(var(--tono), .13);
      border: 1px solid rgba(var(--tono), .38);
      box-shadow: 0 0 30px -6px rgba(var(--tono), .65);
      transition: box-shadow .28s, transform .28s;
    }
    .area:hover .area-sigla { box-shadow: 0 0 44px -2px rgba(var(--tono), .9); transform: scale(1.06); }

    .area-cuerpo { margin-top: auto; }
    .area-cuerpo strong {
      display: block;
      font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.08; letter-spacing: -.03em;
    }
    .area-cuerpo small { display: block; margin-top: 8px; font-size: 14.5px; color: var(--suave); }

    .area-entrar {
      display: inline-flex; align-items: center; gap: 10px;
      font-weight: 600; font-size: 14px; color: rgb(var(--tono));
    }
    .area-entrar i {
      display: block; width: 26px; height: 2px; border-radius: 2px;
      background: currentColor; box-shadow: 0 0 10px currentColor;
      transition: width .28s cubic-bezier(.2, .7, .2, 1);
    }
    .area:hover .area-entrar i, .area:focus-visible .area-entrar i { width: 56px; }

    /* ---------- Pie ---------- */
    .pie { margin-top: 38px; display: flex; justify-content: center; }
    .firma { text-align: center; }
    .firma::before {
      content: ""; display: block; width: 34px; height: 3px; margin: 0 auto 10px;
      border-radius: 3px; background: var(--cobalto-claro); box-shadow: 0 0 14px var(--cobalto);
    }
    .firma p { font-family: var(--font-display); font-weight: 600; font-size: 16px; letter-spacing: -.01em; }

    /* ==========================================================
       ANIMACIONES
       ========================================================== */
    @keyframes pulso { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .55; } }
    @keyframes entrada { from { opacity: 0; transform: translateY(28px) scale(.97); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* ==========================================================
       RESPONSIVO
       ========================================================== */
    @media (max-width: 1180px) {
      .areas { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .area { min-height: 250px; }
    }

    @media (max-width: 700px) {
      .pagina { width: calc(100% - 32px); padding-top: 18px; }
      .areas { grid-template-columns: minmax(0, 1fr); gap: 14px; }
      .area { min-height: 210px; padding: 22px; border-radius: 20px; }
      .area-cuerpo strong { font-size: 28px; }
      .principal { gap: 30px; }
      .titulo p { font-size: 16px; }
      .reloj { display: none; }
    }
  </style>
</head>

<body>
  <noscript>Activa JavaScript en tu navegador para ver los reportes.</noscript>

  <div class="fondo"></div>
  <div class="rejilla"></div>
  <canvas id="red" aria-hidden="true"></canvas>

  <div class="pagina">

    <header class="barra">
      <div class="marca">
        <span class="marca-icono" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="12" width="4.2" height="9" rx="1.4"/><rect x="9.9" y="3" width="4.2" height="18" rx="1.4"/><rect x="16.8" y="8" width="4.2" height="13" rx="1.4"/></svg>
        </span>
        <span class="marca-texto">
          <span class="marca-nombre">Big Data</span>
          <span class="marca-sub">Data Analytics</span>
        </span>
      </div>
      <div class="reloj" id="reloj"></div>
    </header>

    <main class="principal">
      <section class="titulo">
        <h1 id="titulo" aria-label="Big Data"><span id="tituloTxt" aria-hidden="true">Big Data</span></h1>
        <p>Elige un área para entrar a sus reportes.</p>
      </section>

      <section class="areas" id="areas" aria-label="Áreas"></section>
    </main>

    <footer class="pie">
      <div class="firma"><p>Somos el Toro</p></div>
    </footer>

  </div>

  <script>
    (() => {
      "use strict";

      /* ======================================================
         CONFIGURACIÓN: aquí agregas, quitas o cambias áreas.
         - url: carpeta de cada portal. Si algún portal está publicado
           en otro lugar, pon aquí su dirección completa
           (ej. "https://somoseltoro.github.io/VentasDashboards/")
         - sigla: las 2 letras del cuadro
         - descripcion: texto pequeño bajo el nombre
         - tono: color de brillo de la tarjeta, en formato R,G,B
         ====================================================== */
      const SISTEMAS = [
        {
          id: "compras",
          nombre: "Compras",
          sigla: "CO",
          descripcion: "Calendarios, indicadores y presupuesto",
          tono: "34,211,238",
          url: "./compras/"
        },
        {
          id: "contraloria",
          nombre: "Contraloría",
          sigla: "CT",
          descripcion: "Gastos, pagos y monitoreo",
          tono: "167,139,250",
          url: "./contraloria/"
        },
        {
          id: "ventas",
          nombre: "Ventas",
          sigla: "VE",
          descripcion: "Reportes por proveedor",
          tono: "124,156,255",
          url: "./ventas/"
        },
        {
          id: "macande",
          nombre: "MACANDE",
          sigla: "MA",
          descripcion: "Dashboard Macande",
          tono: "52,211,153",
          url: "./macande/"
        }
      ];

      /* ====================================================== */
      const reducido = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

      /* Si abres el archivo directo desde la carpeta (sin servidor), una carpeta
         no abre sola su index.html; así que en ese caso se agrega al enlace. */
      const archivoLocal = location.protocol === "file:";
      function direccion(url) {
        return archivoLocal && url.endsWith("/") ? url + "index.html" : url;
      }

      /* ---------- Tarjetas de las áreas ---------- */
      const contenedor = document.getElementById("areas");
      SISTEMAS.forEach((s, i) => {
        const a = document.createElement("a");
        a.className = "area";
        a.href = direccion(s.url);
        a.style.setProperty("--tono", s.tono);
        a.style.setProperty("--i", String(i));
        a.innerHTML = '<span class="area-sigla" aria-hidden="true"></span>' +
          '<span class="area-cuerpo"><strong></strong><small></small></span>' +
          '<span class="area-entrar">Entrar<i aria-hidden="true"></i></span>';
        a.querySelector(".area-sigla").textContent = s.sigla;
        a.querySelector("strong").textContent = s.nombre;
        a.querySelector("small").textContent = s.descripcion || "";
        a.addEventListener("pointermove", (e) => {            // la luz sigue al cursor
          const r = a.getBoundingClientRect();
          a.style.setProperty("--mx", (e.clientX - r.left) + "px");
          a.style.setProperty("--my", (e.clientY - r.top) + "px");
        });
        contenedor.appendChild(a);
      });

      /* ---------- Reloj ---------- */
      const reloj = document.getElementById("reloj");
      function pintarReloj() { reloj.textContent = new Date().toLocaleString("es-MX"); }
      pintarReloj();
      setInterval(pintarReloj, 1000);

      /* ---------- Título que se descifra ---------- */
      (function descifrar() {
        const caja = document.getElementById("tituloTxt");
        const final = caja.textContent;
        if (reducido) return;
        const letras = "01<>/{}[]#$%&*+=?";
        caja.style.minWidth = caja.offsetWidth + "px";      // evita que el título "baile"
        const inicio = performance.now();
        const duracion = 950;
        (function paso(ahora) {
          const t = Math.min(1, ((ahora || performance.now()) - inicio) / duracion);
          const fijas = Math.floor(t * final.length);
          caja.textContent = final.split("").map((c, i) =>
            c === " " || i < fijas ? c : letras[Math.floor(Math.random() * letras.length)]).join("");
          if (t < 1) requestAnimationFrame(paso); else caja.textContent = final;
        })();
      })();

      /* ---------- Red de nodos del fondo ---------- */
      (function red() {
        const lienzo = document.getElementById("red");
        const ctx = lienzo.getContext && lienzo.getContext("2d");
        if (!ctx) return;

        let ancho = 0, alto = 0, nodos = [];
        const cursor = { x: -9999, y: -9999 };
        const DIST = 140, DIST_CURSOR = 190;

        function medir() {
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          ancho = window.innerWidth; alto = window.innerHeight;
          lienzo.width = ancho * dpr; lienzo.height = alto * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          const cantidad = Math.max(28, Math.min(90, Math.floor(ancho * alto / 16000)));
          nodos = Array.from({ length: cantidad }, () => ({
            x: Math.random() * ancho, y: Math.random() * alto,
            vx: (Math.random() - .5) * .45, vy: (Math.random() - .5) * .45,
            r: Math.random() * 1.6 + .7
          }));
        }

        function dibujar() {
          ctx.clearRect(0, 0, ancho, alto);
          for (let i = 0; i < nodos.length; i++) {
            const p = nodos[i];
            if (!reducido) {
              p.x += p.vx; p.y += p.vy;
              if (p.x < 0 || p.x > ancho) p.vx *= -1;
              if (p.y < 0 || p.y > alto) p.vy *= -1;
            }
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(190, 210, 255, .55)";
            ctx.fill();

            for (let j = i + 1; j < nodos.length; j++) {
              const q = nodos[j];
              const d = Math.hypot(p.x - q.x, p.y - q.y);
              if (d < DIST) {
                ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y);
                ctx.strokeStyle = "rgba(150, 175, 255," + ((1 - d / DIST) * .32).toFixed(3) + ")";
                ctx.lineWidth = .8; ctx.stroke();
              }
            }

            const dc = Math.hypot(p.x - cursor.x, p.y - cursor.y);
            if (dc < DIST_CURSOR) {                             // los nodos cercanos se conectan al cursor
              ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(cursor.x, cursor.y);
              ctx.strokeStyle = "rgba(94, 234, 212," + ((1 - dc / DIST_CURSOR) * .55).toFixed(3) + ")";
              ctx.lineWidth = 1; ctx.stroke();
            }
          }
          if (!reducido) requestAnimationFrame(dibujar);
        }

        medir();
        dibujar();
        window.addEventListener("resize", () => { medir(); if (reducido) dibujar(); });
        window.addEventListener("pointermove", (e) => { cursor.x = e.clientX; cursor.y = e.clientY; });
        window.addEventListener("pointerleave", () => { cursor.x = cursor.y = -9999; });
      })();
    })();
  </script>
</body>
</html>
